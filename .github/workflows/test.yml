name: Test the package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: GregorLueg/personal-actions/.github/workflows/rust-test.yml@v1
    with:
      cpu-args: '--release --features binary,quantised,gpu'
      # Windows drops gpu.
      windows-cpu-args: '--release --features binary,quantised'
      # gpu-tests uses GPU backends for shared memory, which does not behave on
      # Windows, so the GPU lane is Linux and macOS only.
      gpu-args: '--release --features binary,gpu,gpu-tests,quantised'
    secrets: inherit
