name: SIMD codegen and x86 benchmark

# Two things that cannot be checked from an Apple Silicon machine: what
# instructions the x86_64 build actually emits, and what the wider vector paths
# are worth on real x86 hardware.
#
# GitHub's standard runners are AVX2+FMA and have no AVX-512, so the 512-bit
# kernels get compile coverage and a codegen count here, never a timing.
#
# The codegen guard runs on every pull request that touches the SIMD code. The
# benchmark does not: it is minutes of runner time and the answer only changes
# when a kernel does, so it wants asking for. `workflow_dispatch` is the usual
# way, but GitHub only registers a dispatchable workflow once it is on the
# default branch, so before this file merges the way to get a timing is the
# `simd-bench` label on the pull request.

on:
  workflow_dispatch:
    inputs:
      bench:
        description: Run the gridsearch timings as well as the codegen count.
        type: boolean
        default: true
  pull_request:
    # `labeled` is not in the default set, so without it adding `simd-bench`
    # changes nothing: the job condition is only ever evaluated on a run, and
    # no run would start.
    types: [ opened, synchronize, reopened, labeled ]
    branches: [ main ]
    paths:
      - 'src/utils/dist.rs'
      - 'src/binary/dist_binary.rs'
      - 'src/binary/turboquant/**'
      - '.github/workflows/simd-check.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What the default build emits. Zero `ymm` means the AVX2 dispatch arm is a
  # fiction, which is exactly the bug this workflow exists to catch: no test
  # can see it, because the numbers come out right either way.
  codegen:
    name: x86_64 codegen count
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Deliberately without `binary`: `dist_binary.rs` and `turboquant/` were
      # already emitting AVX2 and AVX-512 when `dist.rs` was not, so a build
      # carrying them satisfies the assertion below no matter what `dist.rs`
      # does. This feature set makes the guard load-bearing.
      - name: Emit asm for the default build
        run: cargo rustc --release --lib --features quantised -- --emit asm

      - name: Count vector instructions
        run: |
          asm=$(find target/release/deps -name 'ann_search_rs-*.s' | sort | tail -1)
          echo "asm: $asm"
          for insn in ymm zmm vfmadd popcnt xmm; do
            printf '%-8s %s\n' "$insn" "$(grep -c "$insn" "$asm" || true)"
          done
          for insn in ymm zmm vfmadd; do
            n=$(grep -c "$insn" "$asm" || true)
            if [ "$n" -eq 0 ]; then
              echo "::error::no $insn in the default x86_64 build: the wide-vector dispatch arms are not real"
              exit 1
            fi
          done

  # Three points, because two of them answer different questions.
  #
  #   main-baseline vs baseline   what the runtime dispatch bought
  #   baseline      vs x86-64-v3  what is left above it, in code the dispatch
  #                               does not reach
  #
  # Both PR legs already select the AVX2 kernels at runtime, so a flat
  # `baseline` -> `x86-64-v3` delta on the exhaustive rows is the *good* result:
  # it says the kernels no longer respond to a build flag. Reading that as "the
  # port did nothing" needs the `main` leg to refute it, which is why it is here.
  #
  # Small datasets on purpose: these are ratios between builds, not throughput.
  # The published tables in docs/ are where absolute numbers live.
  bench:
    name: gridsearch (${{ matrix.label }})
    if: >-
      inputs.bench ||
      contains(github.event.pull_request.labels.*.name, 'simd-bench')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # `ref` empty means the pull request's own merge commit.
          - label: main-baseline
            ref: main
            rustflags: ''
          - label: baseline
            ref: ''
            rustflags: ''
          - label: x86-64-v3
            ref: ''
            rustflags: '-C target-cpu=x86-64-v3'
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.label }}

      - name: HNSW
        run: cargo run --example gridsearch_hnsw --release -- --n-samples 10000 --dim 64

      - name: IVF
        run: cargo run --example gridsearch_ivf --release -- --n-samples 10000 --dim 96

      - name: PQ
        run: cargo run --example gridsearch_pq --release --features quantised -- --n-samples 10000 --dim 256
