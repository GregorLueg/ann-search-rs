name: Release the Python bindings

# Triggered by a completed test run, not by a push, so a broken build can never
# be published. `workflows:` must match the `name:` of python-test.yml.
#
# The tag prefix is `py-v`, not `v`: release.yml already owns `v$version` for
# the crate. The two versions are independent lines, so a Python patch release
# and a crate release never collide and never imply each other. The wheel
# reports which crate it vendored as `ann_search.__core_version__`.

on:
  workflow_run:
    workflows: ["Test the Python bindings"]
    branches: [ main ]
    types: [ completed ]
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the wheels. Off by default, so a dispatch only builds.
        type: boolean
        default: false
      index:
        description: Which index to upload to.
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi
      tag:
        description: Create the py-v tag and the GitHub release.
        type: boolean
        default: false

permissions:
  contents: write
  # PyPI trusted publishing. A called workflow's permissions are capped by the
  # caller's token, so leaving this out makes the publish 403.
  id-token: write

jobs:
  release:
    uses: GregorLueg/personal-actions/.github/workflows/python-maturin-release.yml@feat/python-workflows
    with:
      # A dispatch takes what the form asked for. Anything else, meaning the
      # automatic run after a green test on main, takes the constants below.
      #
      # SAFETY CATCH: those constants are both false until the first release is
      # ready, so an ordinary push builds wheels and writes nothing. Flipping
      # them to true is the commit that arms automatic releases.
      publish: ${{ github.event_name == 'workflow_dispatch' && inputs.publish || false }}
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || false }}
      # A choice rather than a free-text URL: the first rehearsal went ten
      # minutes into the wheel matrix before dying on a branch name pasted into
      # a text box. There are only ever two answers here.
      repository-url: ${{ (github.event_name == 'workflow_dispatch' && inputs.index == 'testpypi') && 'https://test.pypi.org/legacy/' || '' }}

      # The sdist would carry a `path` dependency on the parent crate, which is
      # not known to round-trip. Wheels only until `maturin sdist` plus a clean
      # install has been shown to work.
      sdist: false
      environment: pypi
